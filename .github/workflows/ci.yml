name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Contract coverage (GG-1/OI-PF-121)
        run: python3 backend/tools/contract_coverage_check.py .

  test-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test integrity (A2-1/OI-PF-012)
        run: python3 backend/tools/test_integrity_check.py .

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Compile check
        run: python -m compileall -q backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0（SHA 经 GitHub API 实测）
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # G7-01 真实后端 E2E 在 Playwright 里启动 `python3 app/main.py`（G7_E2E_MODE=1）
      # —— 前端作业需要 Python 运行时；与后端作业同一 pinned 版本。
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install (lockfile 哈希锁定)
        run: npm ci
      - name: Typecheck (G5-01)
        run: npm run lint
      - name: Test (G5-01，DOM 断言 + 变异注入)
        run: npm test
      - name: Build (G5-01)
        run: npm run build
      - name: E2E（G5-07 纵向验收 + 阻断态浏览器用例）
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: E2E G7（G7-01 真实后端三例合成 golden，浏览器→后端 HTTP 流）
        run: |
          npm run test:e2e:g7

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-pass
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install deps (G1-03)
        run: pip install --require-hashes -r requirements.txt
      - name: Run tests (SQLite)
        run: |
          python -m unittest discover -s backend/tests -v
      - name: Run tests (PostgreSQL, A1b)
        env:
          DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/ci
          PGPASSWORD: ci-pass
        run: |
          python -m unittest discover -s backend/tests -v
      - name: Empty-test guard (BF-02)
        run: |
          count=$(python -c "import unittest,glob;print(len([f for f in glob.glob('backend/tests/test_*.py')]))")
          if [ "$count" -eq 0 ]; then
            echo "❌ 空测试必失败（BF-02）：backend/tests/ 下无任何 test_*.py"
            exit 1
          fi

  scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Secret scan (N20)
        run: python backend/tools/secret_scan.py .
      - name: Data ingress scan (L4 / N19)
        run: python backend/tools/data_ingress_scan.py .
      - name: Upstream taint scan (N21)
        run: python backend/tools/upstream_taint_scan.py .
      - name: Arch import check (N24 / M1-M7)
        run: python backend/tools/arch_import_check.py .
      # OI-PF-186：公开仓库卫生 —— 本机绝对路径 + 仓库根条目默认拒绝。
      # 该维度此前零覆盖：mut_g6path.py（含本机路径与私有台账目录布局）
      # 被 git add -A 扫进仓库根，在公开 main 上待了一整天才被偶然发现。
      - name: Repo hygiene (OI-PF-186)
        run: python backend/tools/repo_hygiene_check.py .
      # OI-PF-180：写权矩阵每行须显式 ENFORCED 或 NOT_APPLICABLE（默认拒绝）。
      # 此前 jobs.py 写着「调用方须自行按 writers.json 断言」，而没有任何
      # 调用方做过 —— 责任下推给了一个不存在的接收方。
      - name: Writer matrix coverage (OI-PF-180)
        run: python backend/tools/writer_coverage_check.py .
      # OI-PF-175/188/189/190：未读取形参须显式豁免并写明理由（默认拒绝），
      # 且**死豁免判红**。形参未读取有两种：签名多了个不用的参数（读签名会
      # 误解），与**调用方意图被吞掉**（传了控制值却静默无效）—— 后者更严重：
      # evaluate 的 constants_override 实测传 0.99 与不传输出逐字相同。
      - name: Unused param exemptions (OI-PF-188/189/190)
        run: python backend/tools/unused_param_check.py .
      # OI-PF-140：下面三道守卫从未接进 CI —— 合并 ≠ 生效。ADR-018 §3 的裁定
      # 以 §4 三道守卫落地为前提，而没有 CI 门禁，任何 PR 都能把它们改红而无人察觉。
      - name: AKShare use check (ADR-018 §4 guards A+B+C wiring)
        run: python backend/tools/akshare_use_check.py .
      - name: Rights action map check (OI-PF-128)
        run: python backend/tools/rights_action_map_check.py .
      - name: Supply-chain wheel policy (OI-PF-131, offline)
        run: python backend/tools/wheel_policy_check.py .
      - name: Fixture shape check (OI-PF-129)
        run: python backend/tools/fixture_shape_check.py .
      # A-2a：研究数据隔离 —— 合成 fixture 不得冒充真实数据（G3-修复 A-2）
      - name: Research data interdict (A-2a)
        run: python backend/tools/research_data_interdict.py .
      # OI-PF-012 由 main 的独立 test-integrity 作业承担（PR #44，已是 required
      # check）。此处不再重复接线 —— 同一守卫挂两处会让「哪一处是 required」
      # 变得含糊，而 required 与否正是 OI-PF-140 的教训所在。
      # G6C H-8：CALIBRATION_PENDING 不得冒充能力 —— 表述守卫（G6C-03 一票否决）
      - name: Calibration claim check (G6C-03 H-8)
        run: python backend/tools/calibration_claim_check.py .

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-pass
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --require-hashes -r requirements.txt
      - name: Migration check - SQLite (K-1/T2)
        run: python backend/tools/migration_check.py
      - name: Migration check - PostgreSQL (R-1a/E3)
        env:
          DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/ci
          PGPASSWORD: ci-pass
        run: python backend/tools/migration_check.py
  sbom-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: SBOM check (G1-07 3b)
        run: python backend/tools/sbom_check.py

  container-policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Container policy check (G1-07 3b / N17-N18)
        run: python backend/tools/container_policy_check.py

  docker-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-pass
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image (digest-pinned base, non-root)
        run: |
          docker build -t bootstrap-smoke .
      # OI-PF-064：经典 Docker 构建器**静默忽略 --platform**，产出错架构镜像
      # 并报 Successfully built / Successfully tagged —— 只有 docker run 时才
      # 暴露。故构建步骤须显式断言产物架构，**不得以 docker build 退出码 0
      # 作为跨架构构建成功的证据**。runner 为 ubuntu-latest（amd64/linux）。
      - name: Assert image architecture (OI-PF-064)
        run: python3 backend/tools/image_arch_check.py bootstrap-smoke amd64/linux
      - name: Verify health endpoints
        run: |
          id=$(docker run -d -p 18080:8080 bootstrap-smoke)
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/livez >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/livez
          curl -fsS http://127.0.0.1:18080/readyz
          docker rm -f "$id"
      - name: Non-root check (G0-07)
        run: |
          docker run --rm bootstrap-smoke id -u | grep -qx 10001
      - name: Vertical smoke in container - SQLite (G1-06 2b/2c)
        run: |
          docker run --rm -e DATABASE_URL=sqlite:////tmp/smoke.db \
            bootstrap-smoke python3 backend/tools/vertical_smoke.py
      - name: Vertical smoke in container - PostgreSQL (A1b)
        run: |
          docker run --rm --add-host host.docker.internal:host-gateway \
            -e DATABASE_URL=postgresql+psycopg://postgres@host.docker.internal:5432/ci \
            -e PGPASSWORD=ci-pass \
            bootstrap-smoke python3 backend/tools/vertical_smoke.py
      - name: Container bind verification (G1-05 1c)
        run: |
          docker run -d --name bindcheck -p 18082:8080 bootstrap-smoke
          for i in $(seq 1 20); do
            if docker exec bindcheck python3 -c "import socket;s=socket.socket();s.bind(('127.0.0.1',0))" 2>/dev/null; then break; fi
            sleep 1
          done
          docker exec bindcheck python3 -c "import socket,time;s=socket.socket();s.settimeout(1);r=s.connect_ex(('127.0.0.1',8080));print('container loopback 8080 connect rc=',r);assert r==0"
          docker rm -f bindcheck
      - name: Image carries full backend deps (M1/OI-PF-101)
        run: |
          docker run --rm bootstrap-smoke python3 -c "import backend.app.repository"
