name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Compile check
        run: python -m compileall -q backend

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install deps (G1-03)
        run: pip install --require-hashes -r requirements.txt
      - name: Run tests
        run: |
          python -m unittest discover -s backend/tests -v
      - name: Empty-test guard (BF-02)
        run: |
          count=$(python -c "import unittest,glob;print(len([f for f in glob.glob('backend/tests/test_*.py')]))")
          if [ "$count" -eq 0 ]; then
            echo "❌ 空测试必失败（BF-02）：backend/tests/ 下无任何 test_*.py"
            exit 1
          fi

  scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Secret scan (N20)
        run: python backend/tools/secret_scan.py .
      - name: Data ingress scan (L4 / N19)
        run: python backend/tools/data_ingress_scan.py .
      - name: Upstream taint scan (N21)
        run: python backend/tools/upstream_taint_scan.py .
      - name: Arch import check (N24 / M1-M7)
        run: python backend/tools/arch_import_check.py .

  migration-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install --require-hashes -r requirements.txt
      - name: Migration check (K-1/T2)
        run: |
          cd backend
          rm -f app.db
          alembic upgrade head
          python - <<'EOF'
          import sqlite3, sys
          sys.path.insert(0, "app")
          from repository import Base
          import jobs
          conn = sqlite3.connect("app.db")
          actual = {r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'")}
          model = set(Base.metadata.tables.keys())
          missing = model - actual
          assert not missing, f"模型表缺失于实际库: {missing}"
          print("模型表 ⊆ 实际表 OK")
          conn.close()
          EOF
          alembic downgrade base
          alembic upgrade head
          python - <<'EOF'
          import sqlite3
          conn = sqlite3.connect("app.db")
          n = len([r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'")])
          assert n >= 4, f"空库重建后表数异常: {n}"
          print("回滚+空库重建 OK")
          conn.close()
          EOF
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image (digest-pinned base, non-root)
        run: |
          docker build -t bootstrap-smoke .
      - name: Verify health endpoints
        run: |
          id=$(docker run -d -p 18080:8080 bootstrap-smoke)
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/livez >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/livez
          curl -fsS http://127.0.0.1:18080/readyz
          docker rm -f "$id"
      - name: Non-root check (G0-07)
        run: |
          docker run --rm bootstrap-smoke id -u | grep -qx 10001
      - name: Image carries full backend deps (M1/OI-PF-101)
        run: |
          docker run --rm bootstrap-smoke python3 -c "import backend.app.repository"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Arch import check (G0-04 M1-M7)
        run: python backend/tools/arch_import_check.py .
