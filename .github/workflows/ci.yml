name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Compile check
        run: python -m compileall -q app tools tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
      - name: Empty-test guard (BF-02)
        run: |
          count=$(python -c "import unittest,glob;print(len([f for f in glob.glob('tests/test_*.py')]))")
          if [ "$count" -eq 0 ]; then
            echo "❌ 空测试必失败（BF-02）：tests/ 下无任何 test_*.py"
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Secret scan
        run: python tools/secret_scan.py .

  data-ingress-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Data ingress scan (L4)
        run: python tools/data_ingress_scan.py .

  upstream-taint-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Upstream taint scan (N21)
        run: python tools/upstream_taint_scan.py .

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image (digest-pinned base, non-root)
        run: |
          docker build -t bootstrap-smoke .
      - name: Verify health endpoints
        run: |
          id=$(docker run -d -p 18080:8080 bootstrap-smoke)
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/livez >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/livez
          curl -fsS http://127.0.0.1:18080/readyz
          docker rm -f "$id"
      - name: Non-root check (G0-07)
        run: |
          docker run --rm bootstrap-smoke id -u | grep -qx 10001
